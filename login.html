<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Portal FAT</title>
<link rel="icon" href="assets/logo-master.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/styles.css?v=1.5.0">
<style>
  .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .login { width: 100%; max-width: 400px; background: #fff; border: 1px solid var(--line); box-shadow: inset 0 3px 0 var(--accent); }
  .login header { display: flex; align-items: center; gap: 14px; padding: 22px 26px 16px; border-bottom: 1px solid var(--line); }
  .login header img { height: 34px; }
  .login header strong { display: block; color: var(--navy-dd); font-size: 15px; font-weight: 600; }
  .login header span { font-size: 12px; color: var(--muted); }
  .login form { padding: 22px 26px 26px; display: grid; gap: 14px; }
  .login .btn { width: 100%; min-height: 42px; }
  .login .msg { display: none; }
  .login .msg.on { display: flex; margin: 0; }
  .login .rodape { font-size: 12px; color: var(--muted); padding: 0 26px 20px; }
</style>
</head>
<body>
<div class="login-wrap">
  <main class="login">
    <header>
      <img src="assets/logo-master.png" alt="Master Project">
      <div><strong>Portal FAT · Automação do Faturamento</strong><span>Clariens · Contabilidade e Controladoria</span></div>
    </header>
    <form id="f" novalidate>
      <h1 style="font-size:19px">Entrar</h1>
      <div class="alert bad msg" id="msg" role="alert"></div>
      <label class="fld">E-mail<input type="text" id="email" autocomplete="username" inputmode="email" required></label>
      <label class="fld">Senha<input type="password" id="senha" autocomplete="current-password" required></label>
      <button class="btn" type="submit" id="btn">Entrar</button>
    </form>
    <p class="rodape">Sem acesso ou esqueceu a senha? Fale com a administradora do portal na Master Project.</p>
  </main>
</div>
<script>
  (function () {
    var f = document.getElementById('f'), msg = document.getElementById('msg'), btn = document.getElementById('btn');
    document.getElementById('email').focus();
    f.addEventListener('submit', async function (ev) {
      ev.preventDefault();
      msg.classList.remove('on');
      btn.disabled = true; btn.textContent = 'Entrando...';
      try {
        var r = await fetch('/api/login', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value, senha: document.getElementById('senha').value }) });
        var j = {}; try { j = await r.json(); } catch (e) { /* sem corpo */ }
        if (!r.ok) throw new Error(j.erro || 'Não consegui entrar agora. Tente de novo.');
        location.href = '/';
      } catch (e) {
        msg.textContent = e.message; msg.classList.add('on');
        btn.disabled = false; btn.textContent = 'Entrar';
      }
    });
  })();
</script>
</body>
</html>
